<!-- Supabase → Authentication → Emails (Email Templates) → «Reset Password».
     Subject: Сброс пароля RelocateSpend: {{ .Token }} -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:420px;margin:0 auto;padding:24px;color:#1b1f1d">
  <h2 style="margin:0 0 12px;font-size:20px">Сброс пароля</h2>
  <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#4a524e">
    Введите этот код в приложении RelocateSpend и придумайте новый пароль:
  </p>
  <p style="margin:0 0 20px;font-size:32px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
  <p style="margin:0;font-size:13px;line-height:1.5;color:#7a837f">
    Код действует 1 час. Если вы не запрашивали сброс — ничего не делайте, пароль останется прежним.<br />
    Enter this code in RelocateSpend to set a new password.
  </p>
</div>
